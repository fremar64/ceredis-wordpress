services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD}
      WP_ALLOW_MULTISITE: ${WP_ALLOW_MULTISITE:-true}
      DISALLOW_FILE_EDIT: ${DISALLOW_FILE_EDIT:-true}
      DISALLOW_FILE_MODS: ${DISALLOW_FILE_MODS:-true}
      AUTOMATIC_UPDATER_DISABLED: ${AUTOMATIC_UPDATER_DISABLED:-true}
      WP_AUTO_UPDATE_CORE: ${WP_AUTO_UPDATE_CORE:-false}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-development}
      WP_DEBUG_LOG: ${WP_DEBUG_LOG:-true}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY:-false}
      SCRIPT_DEBUG: ${SCRIPT_DEBUG:-true}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:?Set WORDPRESS_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:?Set WORDPRESS_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:?Set WORDPRESS_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:?Set WORDPRESS_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?Set WORDPRESS_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:?Set WORDPRESS_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:?Set WORDPRESS_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:?Set WORDPRESS_NONCE_SALT}
      WORDPRESS_DOMAIN: ${WORDPRESS_DOMAIN:-ceredis.test}
      WORDPRESS_SCHEME: ${WORDPRESS_SCHEME:-http}
      WORDPRESS_DEBUG: ${WP_DEBUG:-true}
      WP_MULTISITE: ${WP_MULTISITE:-false}
      CEREDIS_ADMIN_USER: ${CEREDIS_ADMIN_USER:-ceredis-admin}
      CEREDIS_ADMIN_EMAIL: ${CEREDIS_ADMIN_EMAIL:-admin@ceredis.test}
    volumes:
      - wordpress_uploads:/usr/src/wordpress/wp-content/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=stream_context_create([\"http\"=>[\"header\"=>\"Host: \".getenv(\"WORDPRESS_DOMAIN\").\"\\r\\n\"]]); exit(@file_get_contents(\"http://127.0.0.1/wp-login.php\", false, $$c) === false);'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --mysql-native-password=ON
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - wordpress_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  wordpress_db:
  wordpress_uploads:
