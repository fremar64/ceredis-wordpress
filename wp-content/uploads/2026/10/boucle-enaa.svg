<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif" font-size="12.5">
<defs><marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a8f"/></marker></defs>
<rect width="760" height="350" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1c">Chaque réponse de l'élève relance la boucle : observer, comprendre, décider</text>
<rect x="24" y="52" width="712" height="40" rx="8" fill="#eeeeea" stroke="#9a9a8f" stroke-width="1.25"/>
<text x="380" y="77" text-anchor="middle" font-size="13" fill="#1f1f1c">Tableau de bord : l'enseignant suit chaque élève et garde la main</text>
<g fill="none" stroke="#9a9a8f" stroke-width="1.25" stroke-dasharray="4 4"><path d="M380 92V124"/><path d="M632 92V124"/></g>
<g fill="none" stroke="#9a9a8f" stroke-width="1.25">
<path d="M232 176H276" marker-end="url(#loop-arrow)"/>
<path d="M484 176H528" marker-end="url(#loop-arrow)"/>
<path d="M632 228V302H496" marker-end="url(#loop-arrow)"/>
<path d="M264 302H128V228" marker-end="url(#loop-arrow)"/>
</g>
<g fill="none" stroke="#9a9a8f" stroke-width="1.25">
<rect x="24" y="124" width="208" height="104" rx="8"/>
<rect x="276" y="124" width="208" height="104" rx="8"/>
<rect x="528" y="124" width="208" height="104" rx="8"/>
</g>
<g fill="#1f1f1c">
<text x="40" y="148" font-size="13" font-weight="600">1. Observer</text>
<text x="40" y="164">Réponses, erreurs, temps</text>
<text x="40" y="180">passé sur l'exercice,</text>
<text x="40" y="196">indices demandés, abandons</text>
<text x="292" y="148" font-size="13" font-weight="600">2. Comprendre</text>
<text x="292" y="164">Estimer ce que l'élève</text>
<text x="292" y="180">maîtrise et remonter au</text>
<text x="292" y="196">prérequis manquant</text>
<text x="544" y="148" font-size="13" font-weight="600">3. Décider</text>
<text x="544" y="164">Choisir la prochaine</text>
<text x="544" y="180">activité, ni trop facile</text>
<text x="544" y="196">ni trop difficile</text>
</g>
<g fill="#6b6b66" font-size="11.5">
<text x="40" y="216">Brique 1 : données</text>
<text x="292" y="216">Briques 2 et 3 : graphe, IA</text>
<text x="544" y="216">Brique 3 : IA</text>
</g>
<rect x="264" y="278" width="232" height="48" rx="8" fill="#e6eefa" stroke="#2f6fd0" stroke-width="2"/>
<text x="380" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1c">L'élève réalise l'activité</text>
<g fill="#6b6b66" font-size="12" text-anchor="middle">
<text x="196" y="294">nouvelle trace</text>
<text x="564" y="294">activité proposée</text>
</g>
</svg>
